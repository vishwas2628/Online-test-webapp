version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: online-test-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

  backend:
    build: ./backend
    container_name: online-test-backend
    ports:
      - "8080:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/online-test-app
      - JWT_SECRET=secretkey123
    depends_on:
      - mongo
    networks:
      - mern-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: online-test-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
