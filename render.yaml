services:
  - type: web
    name: backend
    env: docker
    repo: https://github.com/vishwas2628/Online-test-webapp
    region: oregon # e.g., oregon, frankfurt, ohio
    plan: free
    healthCheckPath: /api/health
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8080 # Matches nginx.conf upstream port
      - key: MONGO_URI
        sync: false # User must provide MongoDB Atlas URI in dashboard
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: frontend
    env: docker
    repo: https://github.com/vishwas2628/Online-test-webapp
    region: oregon # e.g., oregon, frankfurt, ohio
    plan: free
    dockerfilePath: ./client/Dockerfile.prod
    dockerContext: ./client
    # Routes removed: handled by Nginx in Docker container

# MongoDB service removed: Render does not define Managed MongoDB in Blueprint via 'pserv'.
# Please use an external provider like MongoDB Atlas and provide the MONGO_URI.
